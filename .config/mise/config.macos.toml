[bootstrap.packages]
# Cloud, Containers & Secrets
"brew-cask:docker-desktop" = "latest"
"brew:skopeo" = "latest"

# Git & Code Review
"brew:git" = "latest"
"brew:git-filter-repo" = "latest"
"brew:git-open" = "latest"
"brew:multi-git-status" = "latest"
"brew:tig" = "latest"

# AI & Local Inference
"brew-cask:macparakeet" = "latest"
"brew:llama.cpp" = "latest"

# Shell, Prompt & Text Processing
"brew:bash" = "latest"
"brew:bash-completion@2" = "latest"
"brew:ctags" = "latest"
"brew:hstr" = "latest"
"brew:par" = "latest"
"brew:the_silver_searcher" = "latest"
"brew:tmux-xpanes" = "latest"
"brew:tpm" = "latest"
"brew:ugrep" = "latest"

# Core System & GNU Utilities
"brew:btop" = "latest"
"brew:coreutils" = "latest"
"brew:dateutils" = "latest"
"brew:dos2unix" = "latest"
"brew:gnu-sed" = "latest"
"brew:htop" = "latest"
"brew:make" = "latest"
"brew:tree" = "latest"
"brew:watch" = "latest"

# Networking & Diagnostics
"brew:ipcalc" = "latest"
"brew:iperf3" = "latest"
"brew:tcptraceroute" = "latest"
"brew:trippy" = "latest"

# Scanning & Hardware Drivers
"brew-cask:naps2" = "latest"
"brew:sane-backends" = "latest"

# macOS GUI Apps, Fonts & Gaming
"brew-cask:appcleaner" = "latest"
"brew-cask:firefox" = "latest"
"brew-cask:font-iosevka-term-nerd-font" = "latest"
"brew-cask:fs-uae" = "latest"
"brew-cask:fs-uae-emulator" = "latest"
"brew-cask:fs-uae-launcher" = "latest"
"brew-cask:iterm2" = "latest"
"brew-cask:jiggler" = "latest"
"brew-cask:macvim-app" = "latest"
"brew-cask:microsoft-teams" = "latest"
"brew-cask:prismlauncher" = "latest"
"brew-cask:stats" = "latest"
"brew-cask:steam" = "latest"
"brew-cask:vlc" = "latest"
"brew-cask:winbox" = "latest"
"brew-cask:yubico-authenticator" = "latest"

[env]
_.path = [
    "$HOMEBREW_PREFIX/opt/coreutils/libexec/gnubin", # Add coreutils to PATH (GNU versions)
    "${HOMEBREW_PREFIX/opt/gnu-sed/libexec/gnubin", # Add GNU sed to PATH (required for eks-creds TF bin script)
    "${HOMEBREW_PREFIX/opt/findutils/libexec/gnubin", # Add findutils to PATH (GNU versions)
    "$HOME/go/bin", # Add Go binary directory to PATH
    "${HOMEBREW_PREFIX/opt/curl/bin", # Add curl from Homebrew to PATH (more recent version)
    "/Applications/Docker.app/Contents/Resources/bin", # Add Docker CLI to PATH (macOS)
    "${HOMEBREW_PREFIX/opt/openssl@1.1/bin", # Add OpenSSL 1.1 to PATH (required by some tools)
    "${HOMEBREW_PREFIX}/opt/make/libexec/gnubin", # Add GNU make to PATH

    "${KREW_ROOT:-$HOME/.krew}/bin", # Add Krew (kubectl plugin manager) to PATH
    "$HOMEBREW_PREFIX/opt/python@3.13/libexec/bin", # Add Python to PATH (for development)
    "$HOMEBREW_PREFIX/opt/ansible@9/bin", # Add Ansible to PATH (for automation)
]
CLICOLOR = true # Enable color output in terminal
EDITOR = "${HOMEBREW_PREFIX}/bin/vim" # Set vim as default editor (from Homebrew)
HOMEBREW_NO_ANALYTICS = 1 # Disable Homebrew analytics (for privacy)
HOMEBREW_NO_ASK = 1 # Disable asking for confirmation before downloading and upgrading
HOMEBREW_NO_EMOJI = 1 # Disable Homebrew emojis (for better terminal compatibility)

[shell_alias]
vi = "vim"                          # Use vim as default editor
ykman = "/Applications/YubiKey Manager.app/Contents/MacOS/ykman"  # YubiKey manager alias

[tools]
bitwarden = "latest"
packer = "latest"
