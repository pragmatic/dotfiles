[bootstrap.repos]                      # git repos cloned before dotfiles
"~/Code/pragmatic/dotfiles" = { url = "git@github.com:pragmatic/dotfiles.git", ref = "main" }

[dotfiles]                             # dotfiles: symlink/copy/template
 # "~/.config/nvim" = {}
"~/.bash_profile" = {}
"~/.config/lazygit/config.yml" = {}
"~/.config/mise/config.linux.toml" = {}
"~/.config/mise/config.macos-arm64.toml" = {}
"~/.config/mise/config.macos-x64.toml" = {}
"~/.config/mise/config.macos.toml" = {}
"~/.config/mise/config.toml" = {}
"~/.config/mise/miserc.toml" = {}
"~/.gitattributes" = {}
"~/.gitconfig" = {}
"~/.gitignore" = {}
"~/.inputrc" = {}
"~/.lesskey" = {}
"~/.tigrc" = {}
"~/.tmux.conf" = {}
"~/.vim/autoload/plug.vim" = {}
"~/.vim/colors/inatick.vim" = {}
"~/.vimrc" = {}

[env]
_.path = ["~/bin","~/.local/bin"]
CLICOLOR = true
GROFF_NO_SGR = 1
MCFLY_FUZZY = 3

[settings]
dotfiles.root = "~/Code/pragmatic/dotfiles"
dotfiles.default_mode = "symlink"

[shell_alias]
cdr = "cd $(git rev-parse --show-toplevel)"
grep = "grep --color=auto"          # Enable color output for grep command
ls = "ls --color=auto"              # Enable color output for ls command

[tasks.bootstrap]                      # Run with mise run bootstrap
description = "Install or update Vim plugins headlessly"
run = "vim --noplugin -u ~/.vimrc +PlugInstall +qall"

[tools]
"aqua:aws/session-manager-plugin" = "latest"
"aqua:cantino/mcfly" = "latest"
"github:k1LoW/mo" = "latest"
"github:legal90/awscurl" = "latest"
"github:mikefarah/yq" = "latest"
"github:starship/starship" = "latest"
"github:terraform-docs/terraform-docs" = "latest"
"npm:@d3lm/pr-stats" = "latest"
aws-cli = { version = "latest", symlink_bins = "true" }
betterleaks = "latest"
bun = "latest"
claude-code = "latest"
doggo = "latest"
e1s = "latest"
ffmpeg = "latest"
fnox = "latest"
gh = "latest"
ghorg = "latest"
go = "latest"
goreleaser = "latest"
node = "latest"
npm = "latest"
opentofu = "1.13.2"
pipx = "latest"
pre-commit = "latest"
python = "latest"
tflint = "latest"
usage = "latest"
yq = "latest"
